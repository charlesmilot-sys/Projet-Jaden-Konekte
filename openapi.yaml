openapi: 3.1.0

info:
  title: Jaden Konekté API
  version: 1.0.0
  description: Suivi des jardins connectés (capteurs, arrosage, diagnostic, assistant).

servers:
  - url: http://localhost:8000

paths:
  /api/v1/parcelles:
    get:
      summary: Liste de mes parcelles (paginée)
      tags: [Parcelles]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: taille
          in: query
          required: false
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Une page de parcelles
          content: 
            application/json:
              schema: 
                type: object
                required: [elements, page, taille, total]
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Parcelle'
                  page:
                    type: integer
                  taille:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NonAuthentifie'

                
          
  /api/v1/parcelles/{id}:
    get:
      summary: Détail d'une parcelle
      tags: [Parcelles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: La parcelle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

  /api/v1/parcelles/{id}/commandes:
    post:
      summary: Envoyer un ordre à la vanne
      tags: [Commandes]
      parameters:
        - name: id
          in: path
          required: true
          schema: 
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: 
                  type: string
                  enum: [ouvrir, fermer]
                duree_s:
                  type: integer
                  minimum: 10
                  maximum: 3600
                  default: 600
      responses:
        '202':
          description: Ordre publié, en attende de confirmation de la vanne
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
              
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/DonneesInvalides'


components:
  schemas:
    Parcelle:
      type: object
      required: [id, code, nom, culture]
      properties:
        id:
          type: integer
        code:
          type: string
          example: p1
        nom:
          type: string
          example: Carré de tomates
        culture:
          type: string
          example: tomate
        surface_m2:
          type: number

    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    
    Commande:
      type: object
      required: [id, action, statut, cree_le]
      properties:
        id:
          type: string
          example: cmd-42
        action:
          type: string
          enum: [ouvrir, fermer]
        duree_s:
          type: integer
          example: 600
        origine:
          type: string
          enum: [manuelle, regle, agent]
        statut:
          type: string
          enum: [envoyee, confirmee, echec]
        cree_le:
          type: string
          format: date-time

  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    Introuvable:
      description: Ressource inexistante ou appartenant à un autre exploitant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    
    Conflit:
      description: Action impossible dans l'état actuel (ex. objet hors ligne, règle déjà existante)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    DonneesInvalides:
      description: Valeurs hors de l'intervalle
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'

  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - jwt: []