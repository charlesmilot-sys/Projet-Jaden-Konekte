openapi: 3.1.0

info:
  title: Jaden Konekté API
  version: 1.3.0
  description: |
    Suivi des jardins connectés (capteurs, arrosage, diagnostic, assistant).

    Version 1.1.0 : contrat initial (1.0.0, rédigé avant l'implémentation) mis à jour après comparaison
    avec la spécification générée par FastAPI. Les écarts et leurs raisons sont listés dans ecarts_contrat.md.

    Version 1.2.0 : ajout de la vue d'ensemble (GET /api/v1/apercu) et du journal d'arrosage
    (GET /api/v1/parcelles/{id}/commandes) pour le tableau de bord.

    Version 1.3.0 : l'administrateur crée une parcelle équipée (POST /api/v1/parcelles), l'attribue à un
    exploitant (PATCH /api/v1/parcelles/{id}) et liste les comptes (GET /api/v1/utilisateurs).


servers:
  - url: http://localhost:8000

paths:
  /api/v1/parcelles:
    get:
      summary: Liste de mes parcelles
      tags: [Parcelles]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: taille
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Une page de parcelles
          content:
            application/json:
              schema:
                type: object
                required: [elements, page, taille, total]
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Parcelle'
                  page:
                    type: integer
                  taille:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NonAuthentifie'

                
          
        '422':
          $ref: '#/components/responses/DonneesInvalides'
    post:
      summary: Créer une parcelle équipée et l'attribuer à un exploitant (administrateur)
      description: |
        Crée la parcelle, ses quatre capteurs, sa vanne et une règle d'arrosage au seuil choisi, puis
        l'annonce en MQTT (jaden/<exploitation>/<parcelle>/config) pour le simulateur et l'ingestion.
      tags: [Parcelles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelleEntree'
      responses:
        '201':
          description: Parcelle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
  /api/v1/parcelles/{id}:
    get:
      summary: Détail d'une parcelle
      tags: [Parcelles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: La parcelle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

        '422':
          $ref: '#/components/responses/DonneesInvalides'
    patch:
      summary: Attribuer la parcelle à un autre exploitant (administrateur)
      tags: [Parcelles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attribution'
      responses:
        '200':
          description: La parcelle, dans l'exploitation de son nouvel exploitant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
  /api/v1/apercu:
    get:
      summary: Vue d'ensemble de mes parcelles (humidité, seuil, vanne, arrosages des dernières 24 h)
      tags: [Tableau de bord]
      responses:
        '200':
          description: Une ligne par parcelle accessible à l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApercuParcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
  /api/v1/parcelles/{id}/commandes:
    get:
      summary: Journal des ordres envoyés à la vanne (les plus récents d'abord)
      tags: [Commandes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Ordres manuels et déclenchements de la règle, avec leur statut
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
    post:
      summary: Envoyer un ordre à la vanne
      tags: [Commandes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ouvrir, fermer]
                duree_s:
                  type: integer
                  minimum: 10
                  maximum: 3600
                  default: 600
      responses:
        '202':
          description: Ordre publié, en attende de confirmation de la vanne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

        '503':
          $ref: '#/components/responses/ServiceIndisponible'
  /api/v1/jetons:
    post:
      summary: Connexion
      tags: [Authentification]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel, mot_de_passe]
              properties:
                courriel:
                  type: string
                  format: email
                mot_de_passe:
                  type: string
                  format: password
      responses:
        '200':
          description: connexion réussie, jeton d'accès JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jeton'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/utilisateurs:
    get:
      summary: Liste des comptes (administrateur)
      tags: [Authentification]
      responses:
        '200':
          description: Tous les comptes, exploitants d'abord
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
    post:
      summary: Inscription
      tags: [Authentification]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, prenom, courriel, mot_de_passe]
              properties:
                nom:
                  type: string
                  maxLength: 40
                prenom:
                  type: string
                  maxLength: 40
                courriel:
                  type: string
                  format: email
                  maxLength: 120
                mot_de_passe:
                  type: string
                  format: password
                  minLength: 8
                  writeOnly: true
      responses:
        '201':
          description: inscription reussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/utilisateurs/moi:
    get:
      summary: Profil de l'utilisateur connecté
      tags: [Authentification]
      responses:
        '200':
          description: L'utilisateur identifié par le jeton
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/NonAuthentifie'

    
  
  /api/v1/diagnostics:
    get:
      summary: Liste de mes diagnostics (paginée)
      tags: [Diagnostics]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: taille
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Une page de diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [elements, page, taille, total]
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Diagnostic'
                  page:
                    type: integer
                  taille:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
    post:
      summary: Envoie d'une photo de feuille
      tags: [Diagnostics]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo JPEG ou PNG, 5 Mo max
                parcelle:
                  type: integer
                  description: Parcelle concernée
            encoding:
              image:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Diagnostic réalisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '413':
          description: Image trop volumineuse (plus de 5 Mo)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '415':
          description: Format d'image non pris en charge (JPEG ou PNG attendu)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
        '503':
          $ref: '#/components/responses/ServiceIndisponible'
  /api/v1/diagnostics/{id}:
    get:
      summary: Détail d'un diagnostic
      tags: [Diagnostics]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Le diagnostic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

        '422':
          $ref: '#/components/responses/DonneesInvalides'
    patch:
      summary: Confirmer ou infirmer un diagnostic (validation par l'exploitant)
      tags:
        - Diagnostics
      parameters: &id001
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirme
              properties:
                confirme:
                  type: boolean
      responses:
        '200':
          description: Le diagnostic mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '401': &id002
          $ref: '#/components/responses/NonAuthentifie'
        '404': &id003
          $ref: '#/components/responses/Introuvable'
        '422': &id004
          $ref: '#/components/responses/DonneesInvalides'
        '409':
          description: Seul un diagnostic terminé peut être confirmé
          content: &id005
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/diagnostics/{id}/image:
    get:
      summary: Photo envoyée pour un diagnostic
      tags:
        - Diagnostics
      parameters: *id001
      responses:
        '200':
          description: La photo (JPEG ou PNG)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401': *id002
        '404': *id003
        '422': *id004
  /api/v1/parcelles/{id}/mesures:
    get:
      summary: Historique agrégé d'une grandeur (moyenne, min, max par tranche)
      tags: [Mesures]
      description: Seules les mesures valides sont agrégées. Tranches de 1 h sur 24 h, de 6 h sur 7 jours.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: grandeur
          in: query
          required: true
          schema:
            type: string
            enum: [humidite, temperature, luminosite, intensite]
        - name: periode
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7j]
            default: 24h
      responses:
        '200':
          description: La série agrégée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieMesures'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/parcelles/{id}/flux:
    get:
      summary: Flux temps réel de la parcelle (Server-Sent Events)
      tags:
        - Tableau de bord
      parameters: *id001
      description: |
        Envoie un événement `etat` à la connexion, puis à chaque changement : dernière valeur
        valide de chaque grandeur (avec `fiable: false` si la dernière mesure reçue a été rejetée)
        et état de la vanne. Un commentaire `: ping` toutes les 15 s garde la connexion ouverte.
        Lu avec fetch() côté navigateur pour envoyer l'en-tête Authorization.
      responses:
        '200':
          description: Flux d'événements
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: etat
                data: {"mesures": {"humidite": {"valeur": 31.2, "unite": "%", "ts": "2026-11-20T06:00:00Z", "fiable": true}}, "vanne": {"id": 1, "type": "vanne", "etat": "fermee", "en_ligne": true}}
        '401': *id002
        '404': *id003
        '422': *id004
  /api/v1/parcelles/{id}/equipements:
    get:
      summary: État des équipements de la parcelle (vanne)
      tags: [Commandes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Les équipements de la parcelle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipement'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

        '422':
          $ref: '#/components/responses/DonneesInvalides'
  /api/v1/parcelles/{id}/regle:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Lire la règle d'arrosage de la parcelle
      tags: [Règles]
      responses:
        '200':
          description: La règle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
    put:
      summary: Créer ou remplacer la règle d'arrosage
      tags: [Règles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegleEntree'
      responses:
        '200':
          description: Règle remplacée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regle'
        '201':
          description: Règle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
    patch:
      summary: Modifier une partie de la règle (seuil, durée, activation…)
      tags: [Règles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegleModification'
      responses:
        '200':
          description: Règle modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/assistant/questions:
    post:
      summary: Poser une question à l'assistant agronome
      tags:
        - Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  minLength: 3
                  maxLength: 500
                  example: Comment reconnaître le mildiou de la tomate ?
      responses:
        '200':
          description: |
            Réponse en streaming (Server-Sent Events) :
            - `texte` : `{"t": "..."}`, un fragment de la réponse, à afficher au fil de l'eau ;
            - `fin` : `{"hors_fiches": false, "sources": [{"numero": 1, "source": "...", "section": "..."}], "modele": "..."}` :
              les sources réellement citées dans la réponse (numéros entre crochets) ;
            - `erreur` : `{"detail": "..."}` si le modèle de langage échoue en cours de route.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: texte
                data: {"t": "Le mildiou se reconnaît à "}

                event: fin
                data: {"hors_fiches": false, "sources": [{"numero": 1, "source": "02_tomate_maladies.md", "section": "Mildiou"}], "modele": "openai/gpt-oss-120b"}
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/DonneesInvalides'
        '503':
          $ref: '#/components/responses/ServiceIndisponible'
components:
  schemas:
    Parcelle:
      type: object
      required: [id, code, nom, culture]
      properties:
        id:
          type: integer
        code:
          type: string
          example: p1
        nom:
          type: string
          example: Carré de tomates
        culture:
          type: string
          example: tomate
        surface_m2:
          type: number
        proprietaire:
          type: integer
          description: Identifiant de l'exploitant
        proprietaire_nom:
          type: string
          example: Marie Joseph

    ParcelleEntree:
      type: object
      required: [proprietaire, nom, culture]
      properties:
        proprietaire:
          type: integer
          description: Exploitant à qui la parcelle est attribuée
        nom:
          type: string
          maxLength: 80
          example: Carré de piments
        culture:
          type: string
          maxLength: 30
          example: piment
        surface_m2:
          type: number
          exclusiveMinimum: 0
        seuil:
          type: number
          minimum: 5
          maximum: 70
          default: 30
          description: Seuil d'arrosage de la règle (humidité du sol, %)
        commune:
          type: string
          maxLength: 80
          description: Requise si l'exploitant n'a pas encore d'exploitation

    Attribution:
      type: object
      required: [proprietaire]
      properties:
        proprietaire:
          type: integer
          description: Nouvel exploitant de la parcelle
        commune:
          type: string
          maxLength: 80
          description: Requise si l'exploitant n'a pas encore d'exploitation

    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    ApercuParcelle:
      type: object
      required: [id, code, nom, culture, en_ligne, arrosages_24h]
      properties:
        id:
          type: integer
        code:
          type: string
          example: p1
        nom:
          type: string
        culture:
          type: string
        humidite:
          type: [number, 'null']
          description: Dernière humidité du sol valide (%)
        humidite_ts:
          type: [string, 'null']
          format: date-time
        humidite_fiable:
          type: [boolean, 'null']
          description: False si le capteur d'humidité est en panne
        seuil:
          type: [number, 'null']
          description: Seuil d'arrosage de la règle (%), null sans règle
        regle_active:
          type: [boolean, 'null']
        derniere_decision:
          type: [string, 'null']
        vanne_etat:
          type: [string, 'null']
          enum: [ouverte, fermee, null]
        vanne_jusqua:
          type: [string, 'null']
          format: date-time
        en_ligne:
          type: boolean
        arrosages_24h:
          type: integer
          description: Ouvertures confirmées sur les dernières 24 h
        dernier_arrosage:
          type: [string, 'null']
          format: date-time

    Commande:
      type: object
      required: [id, action, statut, cree_le]
      properties:
        id:
          type: string
          example: cmd-42
        action:
          type: string
          enum: [ouvrir, fermer]
        duree_s:
          type: integer
          example: 600
        origine:
          type: string
          enum: [manuelle, regle, agent]
        statut:
          type: string
          enum: [envoyee, confirmee, echec]
        cree_le:
          type: string
          format: date-time

    Jeton:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          example: 3600

    Utilisateur:
      type: object
      required: [id, prenom, nom, courriel, role]
      properties:
        id:
          type: integer
        prenom:
          type: string
        nom:
          type: string
        courriel:
          type: string
          format: email
        role:
          type: string
          enum: [exploitant, administrateur]

    Diagnostic:
      type: object
      required: [id, statut, image_url, cree_le]
      properties:
        id:
          type: integer
        parcelle:
          type: [integer, 'null']
        classe:
          type: string
          example: Tomato__late_blight
        libelle:
          type: string
          description: Nom de la maladie en français
          example: Mildiou
        score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.94
        modele:
          type: string
          example: mobilenetv3-tomate-v1
        statut:
          type: string
          enum: [en_cours, termine, echec]
        image_url:
          type: string
        confirme:
          type: [boolean, 'null']
          description: Validation par l'exploitant (null tant qu'il n'a pas répondu)
        cree_le:
          type: string
          format: date-time

        fiable:
          type:
            - boolean
            - 'null'
          description: Score au-dessus du seuil de confiance (0,7) ; sinon il faut reprendre la photo
        termine_le:
          type:
            - string
            - 'null'
          format: date-time
    SerieMesures:
      type: object
      required: [grandeur, unite, periode, intervalle, points]
      properties:
        grandeur:
          type: string
          enum: [humidite, temperature, luminosite, intensite]
        unite:
          type: string
          example: '%'
        periode:
          type: string
          enum: [24h, 7j]
        intervalle:
          type: string
          description: Taille d'une tranche
          example: 1 hour
        points:
          type: array
          items:
            $ref: '#/components/schemas/PointMesure'

    PointMesure:
      type: object
      required: [debut, moyenne, min, max, nombre]
      properties:
        debut:
          type: string
          format: date-time
        moyenne:
          type: number
        min:
          type: number
        max:
          type: number
        nombre:
          type: integer
          description: Nombre de mesures valides dans la tranche

    Equipement:
      type: object
      required: [id, type, etat, en_ligne]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [vanne]
        etat:
          type: string
          enum: [ouverte, fermee]
        jusqua:
          type: [string, 'null']
          format: date-time
          description: Fermeture prévue si la vanne est ouverte
        derniere_cmd:
          type: [string, 'null']
          example: cmd-42
        en_ligne:
          type: boolean
          description: Dernier statut publié par l'objet (online / offline)
        maj_le:
          type: [string, 'null']
          format: date-time

    Clause:
      type: object
      required: [op, valeur]
      oneOf:
        - required: [capteur]
        - required: [meteo]
      properties:
        capteur:
          type: string
          enum: [sol/humidite, air/temperature, air/luminosite, pluvio/intensite]
        meteo:
          type: string
          enum: [pluie_6h]
        op:
          type: string
          enum: ['<', '<=', '>', '>=']
        valeur:
          type: number

    Condition:
      type: object
      required: [et]
      properties:
        et:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Clause'
      example:
        et:
          - capteur: sol/humidite
            op: '<'
            valeur: 25
          - meteo: pluie_6h
            op: '<'
            valeur: 2

    Action:
      type: object
      required: [equipement, action]
      properties:
        equipement:
          type: string
          enum: [vanne]
        action:
          type: string
          enum: [ouvrir]
        duree_s:
          type: integer
          minimum: 10
          maximum: 3600
          default: 600

    RegleEntree:
      type: object
      required: [nom, condition, action]
      properties:
        nom:
          type: string
          maxLength: 80
        condition:
          $ref: '#/components/schemas/Condition'
        action:
          $ref: '#/components/schemas/Action'
        active:
          type: boolean
          default: true
        delai_min_s:
          type: integer
          minimum: 0
          default: 7200

    RegleModification:
      type: object
      minProperties: 1
      description: Seuls les champs envoyés sont modifiés
      properties:
        nom:
          type: string
          maxLength: 80
        condition:
          $ref: '#/components/schemas/Condition'
        action:
          $ref: '#/components/schemas/Action'
        active:
          type: boolean
        delai_min_s:
          type: integer
          minimum: 0

    Regle:
      type: object
      required: [id, parcelle, nom, condition, action, active, delai_min_s]
      properties:
        id:
          type: integer
        parcelle:
          type: integer
        nom:
          type: string
        condition:
          $ref: '#/components/schemas/Condition'
        action:
          $ref: '#/components/schemas/Action'
        active:
          type: boolean
        delai_min_s:
          type: integer
        derniere_execution:
          type: [string, 'null']
          format: date-time


        derniere_evaluation:
          type:
            - string
            - 'null'
          format: date-time
          description: Dernière vérification par le service regles
        derniere_decision:
          type:
            - string
            - 'null'
          description: Décision lisible de la dernière vérification, avec la pluie prévue
          example: "Pas d'arrosage : pluie_6h = 4.2 mm prévus, arrosage inutile (pluie prévue sur 6 h : 4,2 mm)"
  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'

    Introuvable:
      description: Ressource inexistante ou appartenant à un autre exploitant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    Interdit:
      description: Action réservée à l'administrateur
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    Conflit:
      description: Action impossible dans l'état actuel (ex. objet hors ligne, règle déjà existante)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    DonneesInvalides:
      description: Valeurs hors de l'intervalle
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'

    ServiceIndisponible:
      description: Service interne indisponible (broker MQTT, inférence ou assistant)
      content: *id005
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - jwt: []
