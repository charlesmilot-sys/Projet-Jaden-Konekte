openapi: 3.1.0

info:
  title: Jaden Konekté API
  version: 1.0.0
  description: Suivi des jardins connectés (capteurs, arrosage, diagnostic, assistant).

servers:
  - url: http://localhost:8000

paths:
  /api/v1/parcelles:
    get:
      summary: Liste de mes parcelles (paginée)
      tags: [Parcelles]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: taille
          in: query
          required: false
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Une page de parcelles
          content: 
            application/json:
              schema: 
                type: object
                required: [elements, page, taille, total]
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Parcelle'
                  page:
                    type: integer
                  taille:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NonAuthentifie'

                
          
  /api/v1/parcelles/{id}:
    get:
      summary: Détail d'une parcelle
      tags: [Parcelles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: La parcelle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcelle'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

  /api/v1/parcelles/{id}/commandes:
    post:
      summary: Envoyer un ordre à la vanne
      tags: [Commandes]
      parameters:
        - name: id
          in: path
          required: true
          schema: 
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: 
                  type: string
                  enum: [ouvrir, fermer]
                duree_s:
                  type: integer
                  minimum: 10
                  maximum: 3600
                  default: 600
      responses:
        '202':
          description: Ordre publié, en attende de confirmation de la vanne
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
              
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/jetons:
    post:
      summary: Connexion
      tags: [Authentification]
      security: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema:
              type: object
              required: [courriel, mot_de_passe]
              properties: 
                courriel:
                  type: string
                  format: email
                mot_de_passe:
                  type: string
                  format: password
      responses: 
        '200': 
          description: connexion réussie, jeton d'accès JWT
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Jeton'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/utilisateurs:
    post:
      summary: Inscription
      tags: [Authentification]
      security: []
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              type: object
              required: [nom, prenom, courriel, mot_de_passe]
              properties:
                nom:
                  type: string
                  maxLength: 40
                prenom:
                  type: string
                  maxLength: 40
                courriel:
                  type: string
                  format: email
                  maxLength: 120
                mot_de_passe:
                  type: string
                  format: password
                  minLength: 8
                  writeOnly: true
      responses:
        '201':
          description: inscription reussie
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

  /api/v1/utilisateurs/moi:
    get:
      summary: Profil de l'utilisateur connecté 
      tags: [Authentification]
      responses: 
        '200': 
          description: L'utilisateur identifié par le jeton
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  
  /api/v1/diagnostics:
    post:
      summary: Envoie d'une photo de feuille
      tags: [Diagnostics]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: 
                  type: string
                  format: binary
                  description: Photo JPEG ou PNG, 5 Mo max 
                parcelle:
                  type: integer
                  description: Parcelle concernée
            encoding: 
              image: 
                contentType: image/jpeg, image/png
      responses: 
        '201':
          description: Diagnostic réalisé
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/Diagnostic'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
        '413':
          description: Image trop volumineuse (plus de 5 Mo)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '415':
          description: Format d'image non pris en charge (JPEG ou PNG attendu)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          $ref: '#/components/responses/DonneesInvalides'

        
        
        

        



        
        
      
components:
  schemas:
    Parcelle:
      type: object
      required: [id, code, nom, culture]
      properties:
        id:
          type: integer
        code:
          type: string
          example: p1
        nom:
          type: string
          example: Carré de tomates
        culture:
          type: string
          example: tomate
        surface_m2:
          type: number

    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    
    Commande:
      type: object
      required: [id, action, statut, cree_le]
      properties:
        id:
          type: string
          example: cmd-42
        action:
          type: string
          enum: [ouvrir, fermer]
        duree_s:
          type: integer
          example: 600
        origine:
          type: string
          enum: [manuelle, regle, agent]
        statut:
          type: string
          enum: [envoyee, confirmee, echec]
        cree_le:
          type: string
          format: date-time

    Jeton: 
      type: object
      required: [access_token, token_type, expires_in]
      properties: 
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          example: 3600

    Utilisateur:
      type: object
      required: [id, prenom, nom, courriel, role]
      properties:
        id:
          type: integer
        prenom:
          type: string
        nom:
          type: string
        courriel:
          type: string
          format: email
        role: 
          type: string
          enum: [exploitant, administrateur]

    Diagnostic:
      type: object
      required: [id, statut, image_url, cree_le]
      properties:
        id: 
          type: integer
        parcelle: 
          type: [integer, 'null']
        classe: 
          type: string
          example: Tomato__late_blight
        libelle: 
          type: string
          description: Nom de la maladie en français
          example: Mildiou
        score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.94
        modele:
          type: string
          example: mobilenetv3-tomate-v1
        statut:
          type: string
          enum: [en_cours, termine, echec]
        image_url:
          type: string
        confirme:
          type: [boolean, 'null']
          description: Validation par l'exploitant (null tant qu'il n'a pas répondu)
        cree_le:
          type: string
          format: date-time


  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'

    Introuvable:
      description: Ressource inexistante ou appartenant à un autre exploitant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    
    Conflit:
      description: Action impossible dans l'état actuel (ex. objet hors ligne, règle déjà existante)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'
    DonneesInvalides:
      description: Valeurs hors de l'intervalle
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Probleme'

  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - jwt: []