# Pile de départ Jaden Konekté : broker MQTT + base de séries temporelles.
# Ajoutez vos propres services (api, ingestion, inference, worker, front…) dans ce fichier.
#   docker compose up -d
services:
  mqtt:
    image: eclipse-mosquitto:2
    environment:
      MQTT_MDP_INGESTION: ${MQTT_MDP_INGESTION:?à définir dans infra/.env}
      MQTT_MDP_API: ${MQTT_MDP_API:?à définir dans infra/.env}
      MQTT_MDP_REGLES: ${MQTT_MDP_REGLES:?à définir dans infra/.env}
      MQTT_MDP_SIMULATEUR: ${MQTT_MDP_SIMULATEUR:?à définir dans infra/.env}
    # Au démarrage : crée les comptes (mots de passe hachés), installe l'ACL, puis lance le broker
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /mosquitto/data
        rm -f passwd; touch passwd; chmod 0700 passwd
        mosquitto_passwd -b passwd ingestion  "$$MQTT_MDP_INGESTION"
        mosquitto_passwd -b passwd api        "$$MQTT_MDP_API"
        mosquitto_passwd -b passwd regles     "$$MQTT_MDP_REGLES"
        mosquitto_passwd -b passwd sim-expl-1 "$$MQTT_MDP_SIMULATEUR"
        cp /mosquitto/config/acl acl; chmod 0700 acl
        chown mosquitto:mosquitto passwd acl
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"      # MQTT
      - "9001:9001"      # MQTT sur WebSocket (navigateur)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data

  db:
    image: timescale/timescaledb-ha:pg16   # inclut TimescaleDB et pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # développement uniquement
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaden"]
      interval: 5s
      retries: 10

  simulateur:
    build: ../simulateur
    command: ["python", "simulateur_capteurs.py", "--broker", "mqtt",
              "--user", "sim-expl-1", "--password", "${MQTT_MDP_SIMULATEUR}",
              "--exploitation", "expl-1", "--parcelles", "p1", "p2", "p3"]
    depends_on: [mqtt]
    profiles: ["simu"]     # docker compose --profile simu up -d

  api:
    build: ../api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: api
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_API}
      INFERENCE_URL: http://inference:8001
      SEUIL_CONFIANCE: "0.6"
    ports:
      - "8000:8000"
    volumes:
      - images-data:/donnees/images     # photos des diagnostics
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      inference:
        condition: service_started

  inference:
    build:
      context: ..                       # racine du dépôt : accès à ia/cnn (voir .dockerignore)
      dockerfile: inference/Dockerfile
    environment:
      MODELE_VERSION: mobilenetv3-tomate-v1
    # Aucun port publié : seul l'API peut l'appeler, par le réseau interne de Docker
    restart: unless-stopped

  ingestion:
    build: ../ingestion
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: ingestion
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_INGESTION}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  regles:
    build: ../regles
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: regles
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_REGLES}
      PERIODE_REGLES_S: "30"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  mqtt-data:
  db-data:
  images-data:
