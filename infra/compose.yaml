# Plateforme Jaden Konekté : toute la pile démarre avec
#   docker compose up -d --build
# Tableau de bord : http://localhost:8000   Documentation de l'API : http://localhost:8000/docs
# Tests : docker compose --profile tests run --rm tests
services:
  mqtt:
    image: eclipse-mosquitto:2
    environment:
      MQTT_MDP_INGESTION: ${MQTT_MDP_INGESTION:?à définir dans infra/.env}
      MQTT_MDP_API: ${MQTT_MDP_API:?à définir dans infra/.env}
      MQTT_MDP_REGLES: ${MQTT_MDP_REGLES:?à définir dans infra/.env}
      MQTT_MDP_SIMULATEUR: ${MQTT_MDP_SIMULATEUR:?à définir dans infra/.env}
    # Au démarrage : crée les comptes (mots de passe hachés), installe l'ACL, puis lance le broker
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /mosquitto/data
        rm -f passwd; touch passwd; chmod 0700 passwd
        mosquitto_passwd -b passwd ingestion  "$$MQTT_MDP_INGESTION"
        mosquitto_passwd -b passwd api        "$$MQTT_MDP_API"
        mosquitto_passwd -b passwd regles     "$$MQTT_MDP_REGLES"
        mosquitto_passwd -b passwd sim-expl-1 "$$MQTT_MDP_SIMULATEUR"
        cp /mosquitto/config/acl acl; chmod 0700 acl
        chown mosquitto:mosquitto passwd acl
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"      # MQTT
      - "9001:9001"      # MQTT sur WebSocket (navigateur)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data

  db:
    image: timescale/timescaledb-ha:pg16   # inclut TimescaleDB et pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # développement uniquement
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Exécutés une seule fois, à la création de la base (volume vide), dans l'ordre des noms
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/demo.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  simulateur:
    build: ../simulateur
    command: ["python", "simulateur_capteurs.py", "--broker", "mqtt",
              "--user", "sim-expl-1", "--password", "${MQTT_MDP_SIMULATEUR}",
              "--exploitation", "expl-1", "--parcelles", "p1", "p2", "p3"]
    depends_on: [mqtt]
    restart: unless-stopped

  api:
    build: ../api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: api
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_API}
      INFERENCE_URL: http://inference:8001
      SEUIL_CONFIANCE: "0.7"            # même seuil que la fiche « protocole d'alerte »
      ASSISTANT_URL: http://assistant:8002
      ADMIN_COURRIEL: ${ADMIN_COURRIEL:-}
      ADMIN_MOT_DE_PASSE: ${ADMIN_MOT_DE_PASSE:-}
      DEMO_MOT_DE_PASSE: ${DEMO_MOT_DE_PASSE:-}
    ports:
      - "8000:8000"
    volumes:
      - images-data:/donnees/images     # photos des diagnostics
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      inference:
        condition: service_started
      assistant:
        condition: service_started

  assistant:
    build:
      context: ..
      dockerfile: assistant/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY:?à définir dans infra/.env}
      GROQ_MODELE: ${GROQ_MODELE:-openai/gpt-oss-120b}
    # Aucun port publié : seule l'API l'appelle, après avoir vérifié le jeton
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  inference:
    build:
      context: ..                       # racine du dépôt : accès à ia/cnn (voir .dockerignore)
      dockerfile: inference/Dockerfile
    environment:
      MODELE_VERSION: mobilenetv3-tomate-v1
    # Aucun port publié : seul l'API peut l'appeler, par le réseau interne de Docker
    restart: unless-stopped

  ingestion:
    build: ../ingestion
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: ingestion
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_INGESTION}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  regles:
    build: ../regles
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: regles
      MQTT_MOT_DE_PASSE: ${MQTT_MDP_REGLES}
      PERIODE_REGLES_S: "30"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  tests:
    build: ../tests
    volumes:
      - ..:/depot:ro                    # le code testé, en lecture seule
    environment:
      API_URL: http://api:8000
    profiles: ["tests"]                 # docker compose --profile tests run --rm tests

volumes:
  mqtt-data:
  db-data:
  images-data:
