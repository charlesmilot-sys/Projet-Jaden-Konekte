# Configuration de DÉVELOPPEMENT (connexions anonymes autorisées).
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# ---- Pour la version sécurisée (évaluée) ----
# 1. Créer les comptes :  mosquitto_passwd -c /mosquitto/config/passwd api
#                         mosquitto_passwd /mosquitto/config/passwd capteur-p1
# 2. Remplacer allow_anonymous par :
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
# 3. Voir acl.exemple pour les droits par topic.
