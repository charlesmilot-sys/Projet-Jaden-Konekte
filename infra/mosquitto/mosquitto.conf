# Mosquitto sécurisé : authentification obligatoire et droits par compte (ACL).
# Les comptes et mots de passe sont créés au démarrage du conteneur
# à partir des variables d'environnement (voir infra/compose.yaml).
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
